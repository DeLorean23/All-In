name: Release

# Creates a GitHub release when VERSION changes on main.
# Older releases stay untouched. Release text comes from RELEASE_NOTES.md.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.v.outputs.version }} already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ZIP
        if: steps.check.outputs.exists == 'false'
        run: |
          ./build.sh "${{ steps.v.outputs.version }}"
          cp "dist/All-In Installer & Update.zip" "All-In.Installer.Update.zip"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" All-In.Installer.Update.zip \
            --target "${{ github.sha }}" \
            --title "All-In Installer & Update v${{ steps.v.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
